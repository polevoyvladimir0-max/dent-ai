name: CI



on:

  workflow_dispatch:

  push:

    branches: [ main, master ]

  pull_request:

    branches: [ main, master ]



env:

  PYTHON_VERSION: "3.13"

  PIP_INDEX_URL: "https://download.pytorch.org/whl/cpu"

  PIP_EXTRA_INDEX_URL: "https://pypi.org/simple"

  PIP_CACHE_DIR: "~/.cache/pip"

  PLATFORMS: "linux/amd64"



jobs:

  quality:

    name: Quality Gate

    runs-on: ubuntu-24.04

    permissions:

      contents: read

    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: ${{ env.PYTHON_VERSION }}



      - name: Cache pip packages

        uses: actions/cache@v4

        with:

          path: ${{ env.PIP_CACHE_DIR }}

          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

          restore-keys: |

            ${{ runner.os }}-pip-



      - name: Install system dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends portaudio19-dev libasound2-dev



      - name: Install tooling

        run: |

          python -m pip install --upgrade pip

          grep -vE "(pywin32|pypiwin32|PyAudio)" requirements.txt > requirements-ci.txt || cp requirements.txt requirements-ci.txt

          pip install -r requirements-ci.txt

          pip install safety semgrep



      - name: Bytecode compile

        run: python -m compileall app bot scripts db pdf_generator.py



      - name: Pytest suite

        env:

          PYTHONWARNINGS: "error::DeprecationWarning"

        run: |

          set +e

          pytest --maxfail=1 --disable-warnings

          status=$?

          if [ "$status" = "5" ]; then

            echo "pytest exited with code 5 (no tests collected); continuing pipeline."

            exit 0

          fi

          exit $status



      - name: Safety vulnerability scan

        continue-on-error: true

        run: |
          # safety "check" deprecated; use "scan" when available.
          # Keep this as a signal, but do not block deploy in OSS tier (exit code may be 64).
          safety scan --file=requirements-ci.txt --full-report || safety check --file=requirements-ci.txt --full-report || true



      - name: Semgrep SAST

        run: semgrep --config=p/ci --error



      - name: Install Grype

        continue-on-error: true

        run: |

          # РСЃРїРѕР»СЊР·СѓРµРј РєРѕРЅРєСЂРµС‚РЅСѓСЋ РІРµСЂСЃРёСЋ РІРјРµСЃС‚Рѕ latest РґР»СЏ РЅР°РґС‘Р¶РЅРѕСЃС‚Рё

          GRYPE_VERSION="v0.80.0"

          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin --version "$GRYPE_VERSION" || {

            echo "Failed to install grype from script, trying direct download..."

            # РђР»СЊС‚РµСЂРЅР°С‚РёРІРЅС‹Р№ РјРµС‚РѕРґ: СЃРєР°С‡РёРІР°РµРј Р±РёРЅР°СЂРЅРёРє РЅР°РїСЂСЏРјСѓСЋ

            curl -sSfL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz" -o /tmp/grype.tar.gz || {

              echo "Warning: Grype installation failed, skipping security scan"

              exit 0

            }

            tar -xzf /tmp/grype.tar.gz -C /tmp

            sudo mv /tmp/grype /usr/local/bin/grype || exit 0

            sudo chmod +x /usr/local/bin/grype

          }



      - name: Grype scan

        continue-on-error: true

        run: |

          if command -v grype >/dev/null 2>&1; then

            grype dir:. --fail-on high || echo "Grype scan completed with warnings"

          else

            echo "Grype not installed, skipping scan"

          fi



  deploy:

    if: github.ref == 'refs/heads/main'

    needs: quality

    runs-on: ubuntu-24.04

    timeout-minutes: 45

    permissions:

      contents: read

      id-token: write

    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Validate deploy secrets

        env:

          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        run: |

          set -euo pipefail

          missing=0

          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret: ${var}" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi



      - name: Deploy to production host

        uses: appleboy/ssh-action@v1.2.0

        env:

          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VAULT_UNSEAL_STRATEGY: ${{ secrets.VAULT_UNSEAL_STRATEGY }}
          VAULT_UNSEAL_LOCKBOX_SECRET_ID: ${{ secrets.VAULT_UNSEAL_LOCKBOX_SECRET_ID }}
          VAULT_UNSEAL_LOCKBOX_ENTRY_PREFIX: ${{ secrets.VAULT_UNSEAL_LOCKBOX_ENTRY_PREFIX }}
          VAULT_UNSEAL_SA_KEY_FILE: ${{ secrets.VAULT_UNSEAL_SA_KEY_FILE }}

        with:

          host: ${{ secrets.DEPLOY_HOST }}

          username: ${{ secrets.DEPLOY_USER }}

          key: ${{ secrets.DEPLOY_SSH_KEY }}

          command_timeout: 45m

          envs: DEPLOY_PATH,VAULT_UNSEAL_STRATEGY,VAULT_UNSEAL_LOCKBOX_SECRET_ID,VAULT_UNSEAL_LOCKBOX_ENTRY_PREFIX,VAULT_UNSEAL_SA_KEY_FILE

          script: |

            set -euo pipefail

            cd "$DEPLOY_PATH"

            git fetch --all
            git reset --hard origin/main

            ENV_FILE_PATH="$DEPLOY_PATH/.env"
            touch "$ENV_FILE_PATH"

            get_env_value() {
              local key="$1"
              sed -n "s/^${key}=//p" "$ENV_FILE_PATH" | tail -n 1
            }

            VAULT_SEAL_ADDR="$(get_env_value VAULT_SEAL_ADDR || true)"
            VAULT_SEAL_TOKEN="$(get_env_value VAULT_SEAL_TOKEN || true)"
            VAULT_SEAL_KEY_NAME="$(get_env_value VAULT_SEAL_KEY_NAME || true)"
            VAULT_SEAL_MOUNT_PATH="$(get_env_value VAULT_SEAL_MOUNT_PATH || true)"

            if [ -n "$VAULT_SEAL_ADDR" ] && [ -n "$VAULT_SEAL_TOKEN" ]; then
              VAULT_SEAL_KEY_NAME="${VAULT_SEAL_KEY_NAME:-dent-ai-unseal}"
              VAULT_SEAL_MOUNT_PATH="${VAULT_SEAL_MOUNT_PATH:-transit/}"

              cat > "$DEPLOY_PATH/infra/vault/config.transit.hcl" <<EOF
            ui = true
            disable_mlock = true

            storage "file" { path = "/vault/file" }

            listener "tcp" {
              address     = "0.0.0.0:8200"
              tls_disable = 1
            }

            api_addr = "http://localhost:8200"
            cluster_addr = "http://vault:8201"

            seal "transit" {
              address         = "${VAULT_SEAL_ADDR}"
              token           = "${VAULT_SEAL_TOKEN}"
              key_name        = "${VAULT_SEAL_KEY_NAME}"
              mount_path      = "${VAULT_SEAL_MOUNT_PATH}"
              tls_skip_verify = true
            }
            EOF

              TMP_ENV="${ENV_FILE_PATH}.tmp"
              grep -vE '^VAULT_CONFIG_FILE=' "$ENV_FILE_PATH" > "$TMP_ENV" || true
              echo "VAULT_CONFIG_FILE=config.transit.hcl" >> "$TMP_ENV"
              mv "$TMP_ENV" "$ENV_FILE_PATH"
            fi

            if [ -n "${VAULT_UNSEAL_LOCKBOX_SECRET_ID:-}" ]; then
              echo "Lockbox auto-unseal configured, ensuring yc CLI..."
              if ! command -v yc >/dev/null 2>&1; then
                echo "yc CLI not found, installing..."
                curl -sSfL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash || true
                export PATH="$HOME/yandex-cloud/bin:$PATH"
              fi
              if ! command -v yc >/dev/null 2>&1; then
                echo "yc CLI install failed or not in PATH" >&2
                exit 1
              fi
              YC_BIN_PATH=$(command -v yc)
              export PATH="$PATH"

              TMP_ENV="${ENV_FILE_PATH}.tmp"
              grep -vE '^VAULT_UNSEAL_(STRATEGY|LOCKBOX_SECRET_ID|LOCKBOX_ENTRY_PREFIX|SA_KEY_FILE)=' "$ENV_FILE_PATH" > "$TMP_ENV" || true
              {
                echo "VAULT_UNSEAL_STRATEGY=${VAULT_UNSEAL_STRATEGY:-lockbox}"
                echo "VAULT_UNSEAL_LOCKBOX_SECRET_ID=${VAULT_UNSEAL_LOCKBOX_SECRET_ID}"
                echo "VAULT_UNSEAL_LOCKBOX_ENTRY_PREFIX=${VAULT_UNSEAL_LOCKBOX_ENTRY_PREFIX:-vault-unseal-key-}"
                echo "VAULT_UNSEAL_SA_KEY_FILE=${VAULT_UNSEAL_SA_KEY_FILE:-/etc/dent-ai/lockbox-sa-key.json}"
              } >> "$TMP_ENV"
              mv "$TMP_ENV" "$ENV_FILE_PATH"
            fi

            echo "Building base image on server..."
            docker build -f infra/docker/base.Dockerfile -t dent_ai_base:dev .

            echo "Building images on server..."
            docker compose build app bot postgres-backup

            echo "Starting containers..."
            docker compose up -d --force-recreate --remove-orphans

            echo "Waiting for containers to start..."
            sleep 5

            echo "Checking container status..."
            docker compose ps

            if [ -n "${VAULT_UNSEAL_LOCKBOX_SECRET_ID:-}" ]; then
              echo "Running vault auto-unseal..."
              sudo env "PROJECT_DIR=$DEPLOY_PATH" "ENV_FILE=$DEPLOY_PATH/.env" "YC_BIN=$YC_BIN_PATH" bash ./infra/scripts/vault-auto-unseal.sh
            else
              echo "Skipping vault auto-unseal (lockbox not configured)"
            fi

            HEALTH_URL="http://127.0.0.1:8000/ping"

            HEALTH_TIMEOUT=600

            HEALTH_INTERVAL=10

            DEADLINE=$(( $(date +%s) + HEALTH_TIMEOUT ))

            HEALTH_OK=0

            while [ "$(date +%s)" -lt "$DEADLINE" ]; do

              if curl --silent --show-error --fail --max-time 10 "$HEALTH_URL"; then

                echo "Application health check passed"

                HEALTH_OK=1

                break

              fi

              echo "Application not ready yet, retrying in ${HEALTH_INTERVAL}s..."

              sleep "$HEALTH_INTERVAL"

            done

            if [ "$HEALTH_OK" -ne 1 ]; then

              echo "Application failed health check after ${HEALTH_TIMEOUT}s" >&2

              docker compose ps || true

              docker compose logs --tail=200 app || true

              if docker compose ps vault >/dev/null 2>&1; then

                docker compose exec -T vault vault status || true

              fi

              exit 1

            fi

            # РћС‡РёСЃС‚РєР° РЅРµРёСЃРїРѕР»СЊР·СѓРµРјС‹С… Docker СЂРµСЃСѓСЂСЃРѕРІ
            echo "Cleaning up unused Docker resources..."
            # РЈРґР°Р»СЏРµРј РѕСЃС‚Р°РЅРѕРІР»РµРЅРЅС‹Рµ РєРѕРЅС‚РµР№РЅРµСЂС‹ СЃС‚Р°СЂС€Рµ 24 С‡Р°СЃРѕРІ
            docker container prune -f --filter "until=24h" || true
            # РЈРґР°Р»СЏРµРј РЅРµРёСЃРїРѕР»СЊР·СѓРµРјС‹Рµ volumes (docker volume prune РЅРµ РїРѕРґРґРµСЂР¶РёРІР°РµС‚ С„РёР»СЊС‚СЂ until)
            docker volume prune -f || true
            # РЈРґР°Р»СЏРµРј build cache СЃС‚Р°СЂС€Рµ 24 С‡Р°СЃРѕРІ
            docker builder prune -af --filter "until=24h" || true
            # РџРѕРєР°Р·С‹РІР°РµРј РёСЃРїРѕР»СЊР·РѕРІР°РЅРёРµ РґРёСЃРєР°
            echo "Docker disk usage after cleanup:"
            docker system df







